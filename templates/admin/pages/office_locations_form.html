{{define "content"}}
<div class="flex h-screen" style="font-family: 'JetBrains Mono', monospace;">
    {{template "admin-sidebar" .}}
    <div class="flex-1 overflow-auto p-8 bg-gray-50">
        <div class="mb-6">
            <a href="/admin/contact/offices" class="text-sm font-bold uppercase hover:underline">&larr; Back to Office Locations</a>
            <h1 class="text-2xl font-bold uppercase tracking-tight mt-2">{{.Title}}</h1>
        </div>

        {{if .Error}}<p role="alert" class="border-2 border-red-700 bg-red-50 text-red-800 p-4 mb-6 max-w-4xl">{{.Error}}</p>{{end}}
        <form method="POST" action="{{.FormAction}}" class="bg-white border-2 border-black p-6 max-w-4xl space-y-6" style="box-shadow: 4px 4px 0px #000;">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Office Name -->
                <div>
                    <label for="office-locations-form-name" class="block text-xs font-bold uppercase mb-1">
                        Office Name *
                        <span class="text-gray-400 cursor-help" title="Name for this location (e.g., 'Houston Headquarters', 'Dallas Office').">&#9432;</span>
                    </label>
                    <input id="office-locations-form-name" type="text" name="name" value="{{if .Item}}{{.Item.Name}}{{end}}" required
                           class="w-full border-2 border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="e.g., Houston Headquarters"
                           style="font-family: 'JetBrains Mono', monospace;">
                </div>

                <!-- Address Line 1 -->
                <div>
                    <label for="office-locations-form-address-line1" class="block text-xs font-bold uppercase mb-1">Address Line 1 *</label>
                    <input id="office-locations-form-address-line1" type="text" name="address_line1" value="{{if .Item}}{{.Item.AddressLine1}}{{end}}" required
                           class="w-full border-2 border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                           style="font-family: 'JetBrains Mono', monospace;">
                </div>

                <!-- Address Line 2 -->
                <div>
                    <label for="office-locations-form-address-line2" class="block text-xs font-bold uppercase mb-1">Address Line 2</label>
                    <input id="office-locations-form-address-line2" type="text" name="address_line2" value="{{if .Item}}{{if .Item.AddressLine2.Valid}}{{.Item.AddressLine2.String}}{{end}}{{end}}"
                           class="w-full border-2 border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                           style="font-family: 'JetBrains Mono', monospace;">
                </div>

                <!-- City -->
                <div>
                    <label for="office-locations-form-city" class="block text-xs font-bold uppercase mb-1">City *</label>
                    <input id="office-locations-form-city" type="text" name="city" value="{{if .Item}}{{.Item.City}}{{end}}" required
                           class="w-full border-2 border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                           style="font-family: 'JetBrains Mono', monospace;">
                </div>

                <!-- State -->
                <div>
                    <label for="office-locations-form-state" class="block text-xs font-bold uppercase mb-1">State *</label>
                    <input id="office-locations-form-state" type="text" name="state" value="{{if .Item}}{{.Item.State}}{{end}}" required
                           class="w-full border-2 border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                           style="font-family: 'JetBrains Mono', monospace;">
                </div>

                <!-- Postal Code -->
                <div>
                    <label for="office-locations-form-postal-code" class="block text-xs font-bold uppercase mb-1">Postal Code *</label>
                    <input id="office-locations-form-postal-code" type="text" name="postal_code" value="{{if .Item}}{{.Item.PostalCode}}{{end}}" required
                           class="w-full border-2 border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                           style="font-family: 'JetBrains Mono', monospace;">
                </div>

                <!-- Country -->
                <div>
                    <label for="office-locations-form-country" class="block text-xs font-bold uppercase mb-1">Country *</label>
                    <input id="office-locations-form-country" type="text" name="country" value="{{if .Item}}{{.Item.Country}}{{else}}India{{end}}" required
                           class="w-full border-2 border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                           style="font-family: 'JetBrains Mono', monospace;">
                </div>

                <!-- Phone -->
                <div>
                    <label for="office-locations-form-phone" class="block text-xs font-bold uppercase mb-1">Phone</label>
                    <input id="office-locations-form-phone" type="text" name="phone" value="{{if .Item}}{{if .Item.Phone.Valid}}{{.Item.Phone.String}}{{end}}{{end}}"
                           class="w-full border-2 border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                           style="font-family: 'JetBrains Mono', monospace;">
                </div>

                <!-- Email -->
                <div>
                    <label for="office-locations-form-email" class="block text-xs font-bold uppercase mb-1">Email</label>
                    <input id="office-locations-form-email" type="email" name="email" value="{{if .Item}}{{if .Item.Email.Valid}}{{.Item.Email.String}}{{end}}{{end}}"
                           class="w-full border-2 border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                           style="font-family: 'JetBrains Mono', monospace;">
                </div>

                <!-- Map URL -->
                <div>
                    <label for="office-locations-form-map-url" class="block text-xs font-bold uppercase mb-1">
                        Map URL
                        <span class="text-gray-400 cursor-help" title="Google Maps HTTPS link for directions. Embed links display the exact map. Share links use the office address for the embedded map.">&#9432;</span>
                    </label>
                    <input id="office-locations-form-map-url" type="url" name="map_url" value="{{if .Item}}{{.Item.MapUrl}}{{end}}"
                           placeholder="https://www.google.com/maps/..."
                           aria-describedby="map-url-help"
                           class="w-full border-2 border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                           style="font-family: 'JetBrains Mono', monospace;">
                </div>

                <p id="map-url-help" class="text-xs text-gray-600 md:col-span-2">Paste a Google Maps share, place or embed URL. Leave blank to map the office address. Short share links open for directions; the interactive map uses the address.</p>
                <!-- Display Order -->
                <div>
                    <label for="office-locations-form-display-order" class="block text-xs font-bold uppercase mb-1">Sort Order</label>
                    <input id="office-locations-form-display-order" type="number" name="display_order" min="0" value="{{if .Item}}{{.Item.DisplayOrder}}{{else}}0{{end}}"
                           class="w-full border-2 border-black px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                           style="font-family: 'JetBrains Mono', monospace;">
                </div>
            </div>

            <!-- Toggles -->
            <div class="flex items-center gap-6 pt-2">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="is_primary" value="1" {{if .Item}}{{if eq .Item.IsPrimary 1}}checked{{end}}{{end}}
                           class="w-4 h-4 border-2 border-black">
                    <span class="text-sm font-bold uppercase"
                          title="Primary office is shown first and used as the default contact address.">
                        Primary Office <span class="text-gray-400 cursor-help">&#9432;</span>
                    </span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="is_active" value="1" {{if .Item}}{{if eq .Item.IsActive 1}}checked{{end}}{{else}}checked{{end}}
                           class="w-4 h-4 border-2 border-black">
                    <span class="text-sm font-bold uppercase">Active</span>
                </label>
            </div>

            <!-- Submit -->
            <div class="pt-4 border-t-2 border-black">
                <button type="submit"
                        class="bg-black text-white px-6 py-2 text-sm font-bold uppercase border-2 border-black hover:translate-x-[1px] hover:translate-y-[1px]"
                        style="box-shadow: 4px 4px 0px #000;">
                    {{if .IsNew}}Create Office{{else}}Update Office{{end}}
                </button>
            </div>
        </form>
    </div>
</div>
{{end}}
