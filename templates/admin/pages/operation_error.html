{{define "content"}}
<div class="flex min-h-screen">
    {{template "admin-sidebar" .}}
    <main class="flex-1 min-w-0 p-8">
        <div class="max-w-2xl bg-white border-2 border-black p-6" role="alert">
            <h1 class="text-2xl font-bold mb-4">{{.Title}}</h1>
            <p class="text-gray-700 mb-6">{{.Message}}</p>
            <div class="flex flex-wrap gap-4">
                <a href="{{.RetryURL}}" class="bg-black text-white px-4 py-2 font-bold">Try again</a>
                <a href="/admin" class="border-2 border-black px-4 py-2 font-bold">Back to dashboard</a>
            </div>
        </div>
    </main>
</div>
{{end}}
